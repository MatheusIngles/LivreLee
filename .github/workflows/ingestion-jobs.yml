name: Jobs de ingestão

on:
  schedule:
    - cron: "0 4 * * *"           # 1x/dia, 1h depois do cron do desafio diário
  workflow_dispatch:               # também dá pra disparar manualmente
    inputs:
      jobs:
        description: "Jobs a rodar (separados por espaço)"
        required: false
        default: "openlibrary google-books covers characters adaptations quotes sales"

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rodar jobs de ingestão
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: >
          node scripts/run-jobs.mjs
          ${{ github.event.inputs.jobs || 'openlibrary google-books covers characters adaptations quotes sales' }}
